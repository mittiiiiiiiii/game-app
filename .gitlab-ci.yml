image: node:latest
image: cypress/browsers:latest

stages:
  - test
  - build
  - deploy
  - e2e_test

cache:
  paths:
    - node_modules/
    - .yarn/cache
    - ~/.cache/Cypress

test:
  stage: test
  script:
    - yarn install --cache-folder .yarn/cache
    - yarn test

build:
  stage: build
  script:
    - yarn run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour
  only:
    - merge_requests

deploy:
  stage: deploy
  script:
    - yarn global add firebase-tools
    - firebase deploy --token $FIREBASE_TOKEN
  only:
    - merge_requests
