image: node:latest
image: cypress/browsers:latest

stages:
  - test
  - build
  - deploy
  - e2e_test

cache:
  paths:
    - node_modules/
    - .yarn/cache
    - ~/.cache/Cypress

test:
  stage: test
  script:
    - yarn install --cache-folder .yarn/cache
    - yarn test

build:
  stage: build
  script:
    - yarn run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

deploy:
  stage: deploy
  script:
    - yarn global add firebase-tools
    - firebase deploy --token $FIREBASE_TOKEN

e2e_test:
  image: cypress/browsers:latest
  stage: e2e_test
  script:
    - yarn install --cache-folder .yarn/cache
    - npx cypress install
    - yarn run cypress:run
  artifacts:
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos
    expire_in: 1 day
