apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-api
  template:
    metadata:
      labels:
        app: db-api
    spec:
      containers:
      - name: db-api
        image: db-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        command: ["node", "db/server.js"]

---

apiVersion: v1
kind: Service
metadata:
  name: db-api-service
spec:
  type: NodePort
  selector:
    app: db-api
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP